<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku Solver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Sudoku Solver</h1>
      <p class="lede">Type a puzzle or paste one in, then let the solver fill it in.</p>
    </header>

    <div class="layout">
      <section class="board-area">
        <div id="grid" class="grid" role="grid" aria-label="Sudoku grid"></div>
        <p id="status" class="status" role="status"></p>
      </section>

      <aside class="panel">
        <div class="buttons">
          <button id="solve" class="primary">Solve</button>
          <button id="watch">Watch it solve</button>
          <button id="stop" hidden>Stop</button>
          <button id="check">Check my answers</button>
          <button id="clear">Clear</button>
        </div>

        <div class="new-puzzle">
          <label>New puzzle
            <select id="level">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>
          <button id="generate">Make one</button>
        </div>

        <label class="speed">Animation speed
          <input id="speed" type="range" min="1" max="10" value="6">
        </label>

        <section class="log-box" aria-label="What the solver is doing">
          <h2>What the solver is doing</h2>
          <ol id="log" class="log"></ol>
          <p class="legend"><span class="key solved">●</span> forced by the rules <span class="key guess">●</span> a guess</p>
        </section>

        <details class="paste">
          <summary>Paste a puzzle</summary>
          <label for="pasteText">81 characters: 1-9 for clues, 0 or . for blanks</label>
          <textarea id="pasteText" rows="3" spellcheck="false" placeholder="53..7....6..195....98....6.8...6...34..8.3..17...2...6.6....28....419..5....8..79"></textarea>
          <button id="load">Load</button>
        </details>

        <dl id="stats" class="stats" hidden></dl>
      </aside>
    </div>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
